    <script>
      (function() {
        // Compatibility fix for browser extensions attempting to intercept window.fetch
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var activeFetch = origFetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // Continue silently if environment restricts window descriptor redefinition
        }

        // Suppress external browser extension injection errors from crashing the page
        window.addEventListener(
          'error',
          function(e) {
            var msg = (e && e.message) || '';
            var file = (e && e.filename) || '';
            var stack = (e && e.error && e.error.stack) || '';
            if (
              file.indexOf('chrome-extension://') !== -1 ||
              stack.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e.preventDefault) e.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function(e) {
            var reason = e && e.reason;
            var stack = (reason && reason.stack) || '';
            var msg = (reason && reason.message) || String(reason || '');
            if (
              stack.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e.preventDefault) e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
